openapi: 3.0.3
info:
  title: GASH Backend REST API
  description: |
    Production-ready REST API for the GASH Sporting Goods e-commerce platform.
    Features robust authentication with HS256 JWT access tokens & atomic refresh token rotation,
    inventory decrement with compensation safeguards, and full product/cart/order management.
  version: 1.0.0
  contact:
    name: GASH Engineering
    email: engineering@example.com
  license:
    name: ISC

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://api.yourdomain.com/api/v1
    description: Production API server

tags:
  - name: Health
    description: Liveness and database-verified readiness probes for container orchestration.
  - name: Auth
    description: User authentication, registration, JWT tokens, and password reset flows.
  - name: Products
    description: Product catalog, category filtering, search, and reviews.
  - name: Cart
    description: Shopping cart management for authenticated users.
  - name: Orders
    description: Checkout, order placement, order status lifecycle, and cancellations.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token passed in the Authorization header: `Bearer <token>`.
        Must be a signed HS256 access token (`type: "access"`).
    SessionCookie:
      type: apiKey
      in: cookie
      name: jocksport_session
      description: Session cookie used by frontend Next.js rewrite proxy.

  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          description: Payload data

    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        results:
          type: integer
          example: 12
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 2
            totalResults:
              type: integer
              example: 12
        data:
          type: array
          items:
            type: object

    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [fail, error]
          example: fail
        message:
          type: string
          example: Resource not found or invalid input.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    SafeUser:
      type: object
      properties:
        _id:
          type: string
          example: 60d0fe4f5311236168a109ca
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          enum: [customer, admin]
          example: customer
        avatar:
          type: string
          format: uri
        phone:
          type: string
          example: "+1234567890"
        isActive:
          type: boolean
          example: true
        isEmailVerified:
          type: boolean
          example: false
        addresses:
          type: array
          items:
            type: object
            properties:
              street:
                type: string
              city:
                type: string
              state:
                type: string
              zipCode:
                type: string
              country:
                type: string
              isDefault:
                type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: SecureP@ssw0rd!

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          example: SecureP@ssw0rd!

    RefreshTokenInput:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/SafeUser'
            tokens:
              $ref: '#/components/schemas/AuthTokens'

    Product:
      type: object
      properties:
        _id:
          type: string
          example: 60d0fe4f5311236168a109ca
        name:
          type: string
          example: Pro Marathon Runner Shoes
        slug:
          type: string
          example: pro-marathon-runner-shoes
        description:
          type: string
        price:
          type: number
          format: float
          example: 129.99
        compareAtPrice:
          type: number
          format: float
          example: 159.99
        category:
          type: string
          example: Footwear
        images:
          type: array
          items:
            type: string
            format: uri
        stock:
          type: integer
          minimum: 0
          example: 45
        ratingsAverage:
          type: number
          minimum: 1
          maximum: 5
          example: 4.8
        ratingsQuantity:
          type: integer
          example: 32
        isFeatured:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true

    CartItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          format: float
          example: 129.99

    Cart:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalPrice:
          type: number
          format: float
          example: 259.98

    OrderItem:
      type: object
      properties:
        product:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: float
        image:
          type: string

    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          type: object
          required: [street, city, state, zipCode, country]
          properties:
            street: { type: string }
            city: { type: string }
            state: { type: string }
            zipCode: { type: string }
            country: { type: string }
        paymentMethod:
          type: string
          enum: [card, cod, momo, vnpay]
          example: cod
        itemsPrice:
          type: number
          format: float
        shippingPrice:
          type: number
          format: float
        taxPrice:
          type: number
          format: float
        totalPrice:
          type: number
          format: float
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
          example: pending
        isPaid:
          type: boolean
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 OK if the Node.js process is active and accepting HTTP connections.
      responses:
        '200':
          description: Server is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Server is healthy and running
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Checks database connectivity. Returns 200 if connected, 503 if disconnected.
      responses:
        '200':
          description: Database is connected and ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  database:
                    type: string
                    example: connected
        '503':
          description: Database disconnected or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Incorrect email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Rotate and exchange refresh token for a new token pair
      description: Rate-limited to 30 requests per 15-minute window. Uses atomic positional updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Tokens rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token, or reuse detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded.

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized.

  /products:
    get:
      tags: [Products]
      summary: Query and paginate products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
            example: -price,ratingsAverage
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: fields
          schema:
            type: string
            example: name,price,slug,images
      responses:
        '200':
          description: List of paginated products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      product: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found.

  /cart:
    get:
      tags: [Cart]
      summary: Get current authenticated user's cart
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      cart: { $ref: '#/components/schemas/Cart' }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the shopping cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cart updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      cart: { $ref: '#/components/schemas/Cart' }

  /orders:
    post:
      tags: [Orders]
      summary: Place a new order with atomic stock verification & compensation
      description: Rate-limited to 15 order submissions per 15-minute window per IP.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, paymentMethod]
              properties:
                shippingAddress:
                  type: object
                  required: [street, city, state, zipCode, country]
                  properties:
                    street: { type: string }
                    city: { type: string }
                    state: { type: string }
                    zipCode: { type: string }
                    country: { type: string }
                paymentMethod:
                  type: string
                  enum: [card, cod, momo, vnpay]
      responses:
        '201':
          description: Order placed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      order: { $ref: '#/components/schemas/Order' }
        '400':
          description: Cart empty, insufficient inventory, or invalid address.
        '429':
          description: Order creation rate limit exceeded.

    get:
      tags: [Orders]
      summary: List user orders (or all orders for admin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      order: { $ref: '#/components/schemas/Order' }
        '404':
          description: Order not found.

  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel an order and atomically restore reserved stock
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order cancelled and stock restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      order: { $ref: '#/components/schemas/Order' }
        '400':
          description: Order cannot be cancelled (e.g. already delivered or cancelled).
